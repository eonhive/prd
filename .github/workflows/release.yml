name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: prd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm release:check

      - name: Run release publish preflight
        run: pnpm release:preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload release preflight summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publish-preflight-summary
          path: examples/dist/release-publish-preflight-summary.json
          if-no-files-found: error

      - name: Version or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  verify-published:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/post-publish-consumer-smoke.yml
    with:
      release_ref: ${{ github.sha }}
