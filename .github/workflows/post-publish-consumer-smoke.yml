name: Post-Publish Consumer Smoke

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Run published registry metadata audit
        run: node ./scripts/release-registry-audit.mjs

      - name: Upload registry audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-registry-audit-summary
          path: examples/dist/release-registry-audit-summary.json
          if-no-files-found: error

      - name: Run published npm consumer smoke
        run: node ./scripts/external-consumer-smoke.mjs --workspace-versions

      - name: Upload consumer smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-consumer-smoke-summary
          path: examples/dist/external-consumer-smoke-summary.json
          if-no-files-found: error
