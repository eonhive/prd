        <h1>Documents were never meant to stand still.</h1>
        <p>PRD is Portable Responsive Document: a manifest-first, structured, profile-based portable document format.</p>
        <ol>
          <li>Awakening: a document begins with meaningful content.</li>
          <li>Responsive: content adapts to the reading space and preserves its order.</li>
          <li>Structure: a manifest connects content, resources, and the profile.</li>
          <li>Profiles: general documents, comics, and storyboards have their own structure.</li>
          <li>Viewer: the reference viewer opens and validates real packages in your browser. It requires JavaScript.</li>
          <li>Portable: content and its declared resources travel together in one package.</li>
        </ol>
        <a style="color: #b1b2ff" href="https://github.com/eonhive/prd/tree/main/docs">Read the format documentation</a>
